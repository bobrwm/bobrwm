name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src tests packages/bobrwm-swipe/src

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

      - name: Fuzz smoke tests
        run: zig build fuzz-smoke --summary all

      - name: Build release
        run: zig build -Doptimize=ReleaseFast
