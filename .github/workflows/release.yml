name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: release-${{ github.event_name == 'push' && 'tip' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Zig
        run: brew install zig

      - name: Configure artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version=tip
            build_version=
          else
            version="$RELEASE_TAG"
            build_version="${RELEASE_TAG#v}"
          fi

          {
            echo "INSTALL_PREFIX=$RUNNER_TEMP/bobrwm"
            echo "APP_PATH=$RUNNER_TEMP/bobrwm/Bobrwm.app"
            echo "ARTIFACT_NAME=bobrwm-${version}-aarch64-macos.zip"
            echo "ARTIFACT_PATH=$RUNNER_TEMP/bobrwm-${version}-aarch64-macos.zip"
            echo "BUILD_VERSION=$build_version"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          build_args=(-Doptimize=ReleaseFast --prefix "$INSTALL_PREFIX")
          if [[ -n "$BUILD_VERSION" ]]; then
            build_args+=("-Dversion-string=$BUILD_VERSION")
          fi
          zig build "${build_args[@]}"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      - name: Sign app bundle
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          # Nested code first. Signing the bundle seals the helpers as they
          # are at that moment, so re-signing one afterwards would invalidate
          # the enclosing signature. --deep would sign them for us but applies
          # the app's options to every nested binary, which is why Apple
          # deprecated it.
          for helper in bobrwm-cli:com.bobrwm.cli bobrwm-swipe:com.bobrwm.swipe; do
            codesign \
              --force \
              --sign "$MACOS_CERTIFICATE_NAME" \
              --identifier "${helper#*:}" \
              --options runtime \
              --timestamp \
              "$APP_PATH/Contents/MacOS/${helper%%:*}"
          done

          # The app takes its identifier from CFBundleIdentifier.
          codesign \
            --force \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --timestamp \
            "$APP_PATH"

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          test "$(codesign -dvv "$APP_PATH" 2>&1 | sed -n 's/^Identifier=//p')" = \
            "com.bobrwm.bobrwm"
          test "$(codesign -dvv "$APP_PATH/Contents/MacOS/bobrwm-cli" 2>&1 | sed -n 's/^Identifier=//p')" = \
            "com.bobrwm.cli"
          test "$(codesign -dvv "$APP_PATH/Contents/MacOS/bobrwm-swipe" 2>&1 | sed -n 's/^Identifier=//p')" = \
            "com.bobrwm.swipe"

      - name: Notarize and staple
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          notarization_key_path="$RUNNER_TEMP/notarization-key.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$notarization_key_path"

          ditto -c -k --keepParent "$APP_PATH" "$ARTIFACT_PATH"

          xcrun notarytool submit "$ARTIFACT_PATH" \
            --key "$notarization_key_path" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER" \
            --wait \
            --timeout 30m

          # The ticket staples to the .app, never to the zip that carried it
          # to Apple, so the bundle has to be repackaged afterwards. A release
          # that skips this still launches, but only for users who can reach
          # Apple's notarization service at first launch.
          xcrun stapler staple "$APP_PATH"
          rm -f "$ARTIFACT_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ARTIFACT_PATH"

      - name: Verify Gatekeeper acceptance
        run: |
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Generate checksum
        run: |
          artifact_sha256="$(shasum -a 256 "$ARTIFACT_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$artifact_sha256" "$ARTIFACT_NAME" > "$ARTIFACT_PATH.sha256"
          echo "ARTIFACT_SHA256=$artifact_sha256" >> "$GITHUB_ENV"

      - name: Move tip tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest Continuous Release" "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin tip

      - name: Upload binary to tip release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tip >/dev/null 2>&1 || \
            gh release create tip \
              --title 'bobrwm tip' \
              --notes 'Latest continuous build from main.' \
              --prerelease \
              --target "$GITHUB_SHA"
          gh release edit tip \
            --title 'bobrwm tip' \
            --notes 'Latest continuous build from main.' \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release upload tip "$ARTIFACT_PATH" "$ARTIFACT_PATH.sha256" --clobber

      - name: Upload binary to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$ARTIFACT_PATH" "$ARTIFACT_PATH.sha256"

      - name: Dispatch to homebrew-tap
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api repos/bobrwm/homebrew-tap/dispatches \
            -f event_type=bottle \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[artifact]=$ARTIFACT_NAME" \
            -f "client_payload[sha256]=$ARTIFACT_SHA256"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/notarization-key.p8"
